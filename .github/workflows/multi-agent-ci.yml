name: Multi-Agent CI

on:
  pull_request:
    paths:
      - "src/opslens/multi_agent/**/*.py"
      - "tests/unit/multi_agent/**/*.py"
      - "docs/adr/0042-*.md"
      - "labs/phase-12-gate-12-*.md"
      - ".github/workflows/multi-agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-agent-quality:
    name: Multi-agent quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff multi-agent slice
        run: uv run ruff check src/opslens/multi_agent tests/unit/multi_agent

      - name: Pyright strict multi-agent slice
        run: uv run pyright src/opslens/multi_agent tests/unit/multi_agent

      - name: Pytest multi-agent slice
        run: uv run pytest tests/unit/multi_agent
