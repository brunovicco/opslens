name: Multi-Agent CI

on:
  pull_request:
    paths:
      - "src/opslens/multi_agent/**/*.py"
      - "tests/unit/multi_agent/**/*.py"
      - "tests/fixtures/multi_agent/**"
      - "scripts/run_multi_agent_comparison_fixture.py"
      - "scripts/run_multi_agent_real_comparison.py"
      - "docs/adr/0042-*.md"
      - "docs/adr/0043-*.md"
      - "docs/adr/0044-*.md"
      - "docs/adr/0056-*.md"
      - "labs/phase-12-gate-12-*.md"
      - "labs/phase-15-gate-15-*.md"
      - "labs/evidence/phase-15-*.json"
      - ".github/workflows/multi-agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-agent-quality:
    name: Multi-agent quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Validate Phase 15 evidence JSON
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("labs/evidence").glob("phase-15-*.json"))
          if not paths:
              raise SystemExit("No Phase 15 evidence JSON files found.")
          for path in paths:
              with path.open("r", encoding="utf-8") as handle:
                  value = json.load(handle)
              if not isinstance(value, dict):
                  raise SystemExit(f"{path} must contain one JSON object.")
              if not isinstance(value.get("artifact_version"), str):
                  raise SystemExit(f"{path} is missing artifact_version.")
          PY

      - name: Run offline comparison fixture
        run: PYTHONPATH=src uv run python scripts/run_multi_agent_comparison_fixture.py > /tmp/multi-agent-comparison.json

      - name: Smoke real comparison entrypoint
        run: PYTHONPATH=src uv run python scripts/run_multi_agent_real_comparison.py --help

      - name: Ruff multi-agent slice
        run: >-
          uv run ruff check
          src/opslens/multi_agent
          tests/unit/multi_agent
          scripts/run_multi_agent_comparison_fixture.py
          scripts/run_multi_agent_real_comparison.py

      - name: Pyright strict multi-agent slice
        run: >-
          uv run pyright
          src/opslens/multi_agent
          tests/unit/multi_agent
          scripts/run_multi_agent_comparison_fixture.py
          scripts/run_multi_agent_real_comparison.py

      - name: Pytest multi-agent slice
        run: uv run pytest tests/unit/multi_agent
