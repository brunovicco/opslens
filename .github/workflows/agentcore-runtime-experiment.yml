name: AgentCore Runtime Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-experiment:
    name: Retired AgentCore experiment guard
    runs-on: ubuntu-latest

    steps:
      - name: Refuse execution without a newly authorized dedicated principal
        run: |
          echo "AGENTCORE_RUNTIME_EXPERIMENT_RETIRED" >&2
          echo "The Phase 14 mutating workflow is intentionally inert after experiment IAM teardown." >&2
          echo "A future AgentCore experiment requires a new architecture, network, and dedicated-IAM decision before this workflow can be rebuilt." >&2
          exit 1
