name: Runtime Exposure CI

on:
  pull_request:
    paths:
      - "src/opslens/runtime_exposure/**/*.py"
      - "tests/unit/runtime_exposure/**/*.py"
      - "tests/fixtures/runtime_exposure/**"
      - "scripts/run_inspector_*.py"
      - "infra/bootstrap/github_inspector_discovery_role.tf"
      - "docs/adr/0060-*.md"
      - "docs/adr/0061-*.md"
      - "docs/adr/0062-*.md"
      - "docs/adr/0063-*.md"
      - "labs/phase-16-*.md"
      - "labs/evidence/phase-16-*.json"
      - ".github/workflows/runtime-exposure-ci.yml"
      - ".github/workflows/inspector-readonly-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-exposure-quality:
    name: Runtime exposure quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Validate Phase 16 evidence JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("labs/evidence").glob("phase-16-*.json"))
          if not paths:
              raise SystemExit("Phase 16 requires at least one evidence artifact.")
          for path in paths:
              with path.open("r", encoding="utf-8") as handle:
                  value = json.load(handle)
              if not isinstance(value, dict):
                  raise SystemExit(f"{path} must contain one JSON object.")
              artifact_version = value.get("artifact_version")
              if not isinstance(artifact_version, str) or not artifact_version:
                  raise SystemExit(f"{path} artifact_version must be a non-empty string.")
          PY

      - name: Validate Gate 16.1 authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "labs/evidence/phase-16-gate-16-1-inspector-runtime-evidence-fit-v1.json"
          )
          value = json.loads(path.read_text(encoding="utf-8"))
          if value.get("decision") != "GO_TO_ONE_BOUNDED_READ_ONLY_DISCOVERY_EXPERIMENT":
              raise SystemExit("Gate 16.1 decision mismatch.")
          authority = value.get("authority")
          if not isinstance(authority, dict):
              raise SystemExit("Gate 16.1 authority evidence missing.")
          if authority.get("repository_risk_is_runtime_exposure") is not False:
              raise SystemExit("Repository risk must not become runtime exposure.")
          if authority.get("network_reachability_currently_ec2_only") is not True:
              raise SystemExit("EC2-only network reachability boundary is required.")
          gate = value.get("gate_16_2_authorization")
          if not isinstance(gate, dict):
              raise SystemExit("Gate 16.2 authorization evidence missing.")
          if gate.get("automatic_iam_widening") is not False:
              raise SystemExit("Automatic IAM widening is forbidden.")
          if gate.get("inspector_activation_or_deactivation") is not False:
              raise SystemExit("Inspector activation/deactivation is forbidden in Gate 16.2.")
          if value.get("pr_89_touched") is not False:
              raise SystemExit("PR #89 must remain untouched.")
          PY

      - name: Validate Gate 16.4 measured Inspector rerun
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "labs/evidence/phase-16-gate-16-4-inspector-readonly-rerun-v1.json"
          )
          value = json.loads(path.read_text(encoding="utf-8"))
          measured = value.get("measured_run")
          if not isinstance(measured, dict):
              raise SystemExit("Gate 16.4 measured run evidence missing.")
          if measured.get("result") != "SUCCESS":
              raise SystemExit("Gate 16.4 must preserve successful Inspector reads.")
          for api_name in ("coverage", "findings"):
              api = measured.get(api_name)
              if not isinstance(api, dict):
                  raise SystemExit(f"Gate 16.4 {api_name} evidence missing.")
              if api.get("outcome") != "SUCCESS":
                  raise SystemExit(f"Gate 16.4 {api_name} must be SUCCESS.")
              if api.get("record_count") != 0:
                  raise SystemExit(f"Gate 16.4 {api_name} measured zero records.")
              if api.get("sdk_retry_count") != 0:
                  raise SystemExit(f"Gate 16.4 {api_name} retries changed.")
          for key in (
              "aws_mutation_count",
              "new_iam_count",
              "model_invocations",
              "capability_executions",
          ):
              if measured.get(key) != 0:
                  raise SystemExit(f"Gate 16.4 widened authority: {key}")
          retention = value.get("retention")
          if not isinstance(retention, dict):
              raise SystemExit("Gate 16.4 retention evidence missing.")
          if retention.get("standing_inspector_discovery_iam") != "DO_NOT_RETAIN_REMOVE":
              raise SystemExit("Temporary Inspector IAM must not be retained.")
          if value.get("pr_89_touched") is not False:
              raise SystemExit("PR #89 must remain untouched.")
          PY

      - name: Validate Gate 16.5 Inspector IAM cleanup
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          cleanup_path = Path(
              "labs/evidence/phase-16-gate-16-5-inspector-iam-cleanup-postapply-v1.json"
          )
          cleanup = json.loads(cleanup_path.read_text(encoding="utf-8"))
          plan = cleanup.get("reviewed_cleanup_plan")
          apply = cleanup.get("apply")
          convergence = cleanup.get("post_apply_convergence")
          verification = cleanup.get("independent_verification")
          retention = cleanup.get("retention")
          if not all(isinstance(v, dict) for v in (plan, apply, convergence, verification, retention)):
              raise SystemExit("Gate 16.5 cleanup evidence shape mismatch.")
          if (plan.get("add"), plan.get("change"), plan.get("destroy")) != (0, 0, 2):
              raise SystemExit("Gate 16.5 cleanup plan must be 0/0/2.")
          expected = {
              "aws_iam_role.github_actions_inspector_discovery",
              "aws_iam_role_policy.github_actions_inspector_discovery",
          }
          if set(plan.get("destroyed_addresses", [])) != expected:
              raise SystemExit("Gate 16.5 destroyed addresses changed.")
          if (apply.get("added"), apply.get("changed"), apply.get("destroyed")) != (0, 0, 2):
              raise SystemExit("Gate 16.5 apply must be 0/0/2.")
          if convergence.get("result") != "NO_CHANGES":
              raise SystemExit("Gate 16.5 requires post-apply convergence.")
          temporary = verification.get("temporary_role")
          shared = verification.get("shared_deploy_role")
          if not isinstance(temporary, dict) or temporary.get("result") != "ABSENT":
              raise SystemExit("Temporary Inspector role must be absent.")
          if temporary.get("aws_error") != "NoSuchEntity":
              raise SystemExit("Temporary role absence must preserve NoSuchEntity evidence.")
          if not isinstance(shared, dict) or shared.get("result") != "PRESENT":
              raise SystemExit("Shared deployment role must remain present.")
          if retention.get("standing_inspector_discovery_iam") != "REMOVED":
              raise SystemExit("Standing Inspector discovery IAM must be removed.")
          if cleanup.get("pr_89_touched") is not False:
              raise SystemExit("PR #89 must remain untouched.")

          closeout_path = Path("labs/evidence/phase-16-closeout-v1.json")
          closeout = json.loads(closeout_path.read_text(encoding="utf-8"))
          if closeout.get("status") != "COMPLETE":
              raise SystemExit("Phase 16 closeout must be COMPLETE.")
          retained = closeout.get("retained_state")
          if not isinstance(retained, dict):
              raise SystemExit("Phase 16 retained state missing.")
          if retained.get("standing_inspector_discovery_iam") != "NONE":
              raise SystemExit("Phase 16 cannot close with standing Inspector IAM.")
          if closeout.get("next_phase") != "Phase 17 — Security Hardening":
              raise SystemExit("Phase 17 must be next after Phase 16 closeout.")
          PY

      - name: Validate retained bootstrap has no Inspector authority
        run: |
          python - <<'PY'
          from pathlib import Path

          retired = Path("infra/bootstrap/github_inspector_discovery_role.tf")
          if retired.exists():
              raise SystemExit("temporary Inspector IAM Terraform must be absent")

          for path in Path("infra/bootstrap").glob("*.tf"):
              text = path.read_text(encoding="utf-8")
              if "inspector2:" in text or "OpsLensInspectorDiscoveryRole" in text:
                  raise SystemExit(f"standing Inspector authority remains in {path}")
          PY

      - name: Validate historical Inspector discovery workflow guardrails
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(".github/workflows/inspector-readonly-discovery.yml").read_text(
              encoding="utf-8"
          )
          required = (
              "workflow_dispatch:",
              "confirm_temporary_role_exists:",
              "default: false",
              "github.ref == 'refs/heads/main'",
              "inputs.confirm_temporary_role_exists == true",
              "OpsLensInspectorDiscoveryRole",
              "role-duration-seconds: 900",
              "run_inspector_readonly_discovery.py",
              "aws_mutation_count",
              "new_iam_count",
          )
          forbidden = (
              "OpsLensGitHubDeployRole",
              "inspector2 enable",
              "inspector2 disable",
              "update-organization-configuration",
              "put-filter",
              "delete-filter",
              "ecr put-registry-scanning-configuration",
          )
          for fragment in required:
              if fragment not in text:
                  raise SystemExit(f"missing Inspector workflow guardrail: {fragment}")
          for fragment in forbidden:
              if fragment in text:
                  raise SystemExit(f"forbidden Inspector workflow fragment: {fragment}")
          PY

      - name: Ruff runtime exposure slice
        run: >-
          uv run ruff check
          src/opslens/runtime_exposure
          tests/unit/runtime_exposure
          scripts/run_inspector_readonly_discovery.py

      - name: Pyright strict runtime exposure slice
        run: >-
          uv run pyright
          src/opslens/runtime_exposure
          tests/unit/runtime_exposure
          scripts/run_inspector_readonly_discovery.py

      - name: Pytest runtime exposure slice
        run: uv run pytest tests/unit/runtime_exposure
