name: Validate EPSS History 2.5C-2 Reconciled

on:
  push:
    branches:
      - phase-2-epss-history
    paths:
      - ".github/workflows/validate-epss-history-c2-reconciled.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Validate lockfile
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check \
            src/opslens/ingestion/epss \
            src/opslens/transformation/epss \
            tests/unit/ingestion/epss \
            tests/unit/transformation/epss \
            scripts/probe_epss_historical_formats.py

      - name: Pyright
        run: uv run pyright

      - name: EPSS unit tests
        run: |
          uv run pytest -q \
            tests/unit/ingestion/epss \
            tests/unit/transformation/epss

      - name: Probe pinned format boundaries
        run: |
          uv run python scripts/probe_epss_historical_formats.py \
            --archive-commit 7ba701f5599057c496489ceecd701cbd43911f5c \
            --dates 2021-04-14 2022-02-03 2022-02-04 2023-03-07 2025-03-17 2026-06-15 \
            > /tmp/epss-boundaries.json

          uv run python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/epss-boundaries.json').read_text())
          assert data['failures'] == []
          by_date = {item['snapshot_date']: item for item in data['results']}
          assert by_date['2021-04-14']['header'] == ['cve', 'epss']
          assert by_date['2021-04-14']['metadata_present'] is False
          assert by_date['2022-02-03']['header'] == ['cve', 'epss', 'percentile']
          assert by_date['2022-02-03']['metadata_present'] is False
          assert by_date['2022-02-04']['header'] == ['cve', 'epss', 'percentile']
          assert by_date['2022-02-04']['metadata_present'] is True
          assert by_date['2023-03-07']['first_line'].startswith('#model_version:v2023.03.01,')
          assert by_date['2025-03-17']['first_line'].startswith('#model_version:v2025.03.14,')
          assert by_date['2026-06-15']['first_line'].startswith('#model_version:v2026.06.15,')
          print('EPSS_HISTORY_REAL_FORMAT_BOUNDARY_GATE=PASS')
          PY

      - name: Reconciled gate marker
        run: echo "EPSS_HISTORY_2_5C2_RECONCILED_VALIDATION=PASS"
