name: GHSA Phase 2.4F Closeout Docs

on:
  push:
    branches:
      - phase-2-ghsa-cross-source-closeout
    paths:
      - ".github/workflows/ghsa-phase-2-4f-closeout-docs.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: phase-2-ghsa-cross-source-closeout

      - name: Correct Portuguese architecture replacement block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_tmp_patch_phase_2_4f_closeout_docs.py")
          text = path.read_text()
          old = '''        (
            "- catálogo Glue explícito de GHSA sobre Silver autoritativo e analytics Athena com custo limitado sobre evidência nested;",
            "- catálogo Glue explícito de GHSA sobre Silver autoritativo e analytics Athena com custo limitado sobre evidência nested;\\n- evidência cross-source determinística centrada em CVE entre NVD, CISA KEV, FIRST EPSS e GHSA com coordenadas temporais explícitas por fonte;",
        ),'''
          new = '''        (
            "- catálogo Glue explícito para GHSA sobre Silver autoritativo e analytics nested no Athena com custo limitado;",
            "- catálogo Glue explícito para GHSA sobre Silver autoritativo e analytics nested no Athena com custo limitado;\\n- evidência cross-source determinística centrada em CVE entre NVD, CISA KEV, FIRST EPSS e GHSA com coordenadas temporais explícitas por fonte;",
        ),'''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"expected one PT-BR tuple block, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Patch documentation fail closed
        run: python scripts/_tmp_patch_phase_2_4f_closeout_docs.py

      - name: Verify target milestone text
        run: |
          grep -F "Phase 2.4 | GitHub Security Advisories | ✅ Complete" README.md
          grep -F "Phase 2.4 | GitHub Security Advisories | ✅ Concluída" README.pt-br.md
          grep -F "Phase 2.4F — GHSA Cross-source Closeout:     COMPLETE" docs/README.md
          grep -F "GitHub Security Advisories          IMPLEMENTED through cross-source deterministic evidence" docs/architecture.md
          grep -F "GitHub Security Advisories          IMPLEMENTED through cross-source deterministic evidence" docs/architecture.pt-br.md

      - name: Commit reconciled docs
        run: |
          git config user.name "Bruno Vicco"
          git config user.email "bfvicco@gmail.com"
          git add README.md README.pt-br.md docs/README.md docs/architecture.md docs/architecture.pt-br.md
          git diff --cached --check
          git commit -m "docs(phase-2): reconcile GHSA 2.4F closeout"
          git push origin HEAD:phase-2-ghsa-cross-source-closeout
