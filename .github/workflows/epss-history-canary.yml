name: EPSS History Canary

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Execute the frozen seven-snapshot canary (default is plan-only)"
        required: true
        type: boolean
        default: false
      confirmation:
        description: "Execution only: enter EPSS-HISTORY-CANARY-7 exactly"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  epss-history-canary:
    name: Historical EPSS seven-snapshot canary
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      EPSS_DATA_BUCKET: opslens-dev-data-487757851499-us-east-1
      EPSS_HISTORY_TRANSFORMER_FUNCTION: opslens-dev-epss-history-transformer

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Configure read-only plan credentials
        if: ${{ !inputs.execute }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::487757851499:role/OpsLensEpssHistoryEvidenceRole
          aws-region: us-east-1
          allowed-account-ids: 487757851499

      - name: Configure bounded coordinator credentials
        if: ${{ inputs.execute }}
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::487757851499:role/OpsLensEpssHistoryCoordinatorRole
          aws-region: us-east-1
          allowed-account-ids: 487757851499

      - name: Plan frozen canary read-only
        if: ${{ !inputs.execute }}
        run: PYTHONPATH=src uv run python scripts/run_epss_history_canary.py

      - name: Validate exact execution confirmation
        if: ${{ inputs.execute }}
        env:
          CANARY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CANARY_CONFIRMATION" = "EPSS-HISTORY-CANARY-7" || {
            echo "Execution requires the exact confirmation EPSS-HISTORY-CANARY-7" >&2
            exit 1
          }

      - name: Execute exactly seven snapshots sequentially
        if: ${{ inputs.execute }}
        env:
          CANARY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          PYTHONPATH=src uv run python scripts/run_epss_history_canary.py \
            --execute \
            --confirmation "$CANARY_CONFIRMATION"
