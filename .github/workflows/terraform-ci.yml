name: Terraform CI

on:
  pull_request:
    paths:
      - "infra/**/*.tf"
      - "infra/**/.terraform.lock.hcl"
      - ".tflint.hcl"
      - ".github/workflows/terraform-ci.yml"
      - "scripts/build_lambda_package.py"
      - "scripts/build_kev_lambda_package.py"
      - "scripts/build_nvd_lambda_package.py"
      - "scripts/build_nvd_incremental_lambda_package.py"
      - "scripts/build_nvd_analytics_projector_lambda_package.py"
      - "scripts/build_epss_history_transformer_lambda_package.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-static-checks:
    name: Terraform static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Build EPSS Lambda package
        run: uv run python scripts/build_lambda_package.py

      - name: Build EPSS history transformer Lambda package
        run: uv run python scripts/build_epss_history_transformer_lambda_package.py

      - name: Build KEV Lambda package
        run: uv run python scripts/build_kev_lambda_package.py

      - name: Build NVD Bootstrap Lambda package
        run: uv run python scripts/build_nvd_lambda_package.py

      - name: Build NVD Incremental Lambda package
        run: uv run python scripts/build_nvd_incremental_lambda_package.py

      - name: Build NVD Analytics Projector Lambda package
        run: uv run python scripts/build_nvd_analytics_projector_lambda_package.py

      - name: Check Terraform formatting
        run: terraform fmt -diff -check -recursive infra

      - name: Initialize bootstrap without backend
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false

      - name: Validate bootstrap
        run: terraform -chdir=infra/bootstrap validate

      - name: Initialize dev without backend
        run: terraform -chdir=infra/environments/dev init -backend=false -input=false

      - name: Validate dev
        run: terraform -chdir=infra/environments/dev validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      - name: Initialize TFLint plugins
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint bootstrap
        run: |
          tflint \
            --config="$GITHUB_WORKSPACE/.tflint.hcl" \
            --chdir=infra/bootstrap \
            --format=compact

      - name: Lint dev
        run: |
          tflint \
            --config="$GITHUB_WORKSPACE/.tflint.hcl" \
            --chdir=infra/environments/dev \
            --format=compact

  terraform-security:
    name: Terraform security scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.3.9

      - name: Scan Terraform with Checkov
        run: checkov --directory infra --framework terraform
