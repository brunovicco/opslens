name: Terraform CI

on:
  pull_request:
    paths:
      - "infra/**/*.tf"
      - "infra/**/.terraform.lock.hcl"
      - ".tflint.hcl"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-static-checks:
    name: Terraform static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize bootstrap without backend
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false

      - name: Validate bootstrap
        run: terraform -chdir=infra/bootstrap validate

      - name: Initialize dev without backend
        run: terraform -chdir=infra/environments/dev init -backend=false -input=false

      - name: Validate dev
        run: terraform -chdir=infra/environments/dev validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Initialize TFLint plugins
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint bootstrap
        run: |
          tflint \
            --config="$GITHUB_WORKSPACE/.tflint.hcl" \
            --chdir=infra/bootstrap \
            --format=compact

      - name: Lint dev
        run: |
          tflint \
            --config="$GITHUB_WORKSPACE/.tflint.hcl" \
            --chdir=infra/environments/dev \
            --format=compact
