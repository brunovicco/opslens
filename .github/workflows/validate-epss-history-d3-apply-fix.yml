name: Validate EPSS History D3 Apply Fix

on:
  push:
    branches:
      - phase-2-epss-history-d3-apply-fix
    paths:
      - ".github/workflows/terraform-dev-apply.yml"
      - ".github/workflows/validate-epss-history-d3-apply-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform apply artifact prerequisites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Build all Terraform-required Lambda packages
        run: |
          uv run python scripts/build_lambda_package.py
          uv run python scripts/build_epss_history_transformer_lambda_package.py
          uv run python scripts/build_kev_lambda_package.py
          uv run python scripts/build_nvd_lambda_package.py
          uv run python scripts/build_nvd_incremental_lambda_package.py
          uv run python scripts/build_nvd_analytics_projector_lambda_package.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform init without backend
        run: terraform -chdir=infra/environments/dev init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra/environments/dev validate

      - name: Verify apply workflow builders
        run: |
          grep -F 'scripts/build_nvd_incremental_lambda_package.py' .github/workflows/terraform-dev-apply.yml
          grep -F 'scripts/build_nvd_analytics_projector_lambda_package.py' .github/workflows/terraform-dev-apply.yml
          echo 'EPSS_HISTORY_D3_APPLY_ARTIFACT_FIX_GATE=PASS'
