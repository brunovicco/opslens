name: GHSA Silver CVSS Fix Validation

on:
  push:
    branches:
      - phase-2-ghsa-silver-runtime
    paths:
      - "src/opslens/transformation/ghsa/domain/collections_transformer.py"
      - "tests/unit/transformation/ghsa/test_ghsa_collections_transformer.py"
      - ".github/workflows/ghsa-silver-cvss-fix-validation.yml"

permissions:
  contents: read

jobs:
  validate-and-export:
    name: Validate fix and export canonical artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lock file
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run GHSA unit tests
        run: uv run pytest tests/unit/transformation/ghsa -q

      - name: Run GHSA Ruff checks
        run: |
          uv run ruff check \
            src/opslens/transformation/ghsa \
            tests/unit/transformation/ghsa \
            scripts/build_ghsa_silver_lambda_package.py

      - name: Run Pyright
        run: uv run pyright

      - name: Build canonical package twice
        shell: bash
        run: |
          set -euo pipefail

          uv run python scripts/build_ghsa_silver_lambda_package.py | tee /tmp/ghsa-build-1.txt
          first_sha="$(grep '^sha256=' /tmp/ghsa-build-1.txt | cut -d= -f2)"

          uv run python scripts/build_ghsa_silver_lambda_package.py | tee /tmp/ghsa-build-2.txt
          second_sha="$(grep '^sha256=' /tmp/ghsa-build-2.txt | cut -d= -f2)"

          test -n "$first_sha"
          test "$first_sha" = "$second_sha"

          sha_b64="$(openssl dgst -sha256 -binary dist/opslens-ghsa-silver.zip | openssl base64 -A)"

          printf '%s  %s\n' "$second_sha" "opslens-ghsa-silver.zip" > dist/opslens-ghsa-silver.sha256
          printf '%s\n' "$sha_b64" > dist/opslens-ghsa-silver.sha256.base64

          echo "canonical_sha256=$second_sha"
          echo "canonical_sha256_base64=$sha_b64"

      - name: Upload canonical deployment bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghsa-silver-lambda-cvss-fix
          path: |
            dist/opslens-ghsa-silver.zip
            dist/opslens-ghsa-silver.sha256
            dist/opslens-ghsa-silver.sha256.base64
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
