name: V1 Demo Runner CI

on:
  pull_request:
    paths:
      - "src/opslens/demo/**"
      - "tests/unit/demo/**"
      - "scripts/_demo_bootstrap.py"
      - "scripts/demo_opslens.py"
      - "scripts/evaluate_opslens_demo.py"
      - "scripts/demo_opslens_web.py"
      - "scripts/verify_phase19_gate19_10_demo_runner.py"
      - "scripts/verify_phase19_gate19_11_demo_scenarios.py"
      - "scripts/verify_phase19_gate19_12_visual_demo.py"
      - "docs/demo/**"
      - "docs/current-state.md"
      - "docs/roadmap.md"
      - "labs/phase-19-gate-19-10-*.md"
      - "labs/phase-19-gate-19-11-*.md"
      - "labs/phase-19-gate-19-12-*.md"
      - "labs/evidence/phase-19-gate-19-10-*.json"
      - "labs/evidence/phase-19-gate-19-11-*.json"
      - "labs/evidence/phase-19-gate-19-12-*.json"
      - ".github/workflows/v1-demo-runner-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v1-demo-runner:
    name: Verify deterministic V1 demo scenarios
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Prove reviewer commands work without PYTHONPATH
        run: |
          env -u PYTHONPATH uv run python scripts/demo_opslens.py --scenario material-vulnerability --format json > /tmp/opslens-reviewer-material.json
          env -u PYTHONPATH uv run python scripts/evaluate_opslens_demo.py --format json > /tmp/opslens-reviewer-suite.json
          env -u PYTHONPATH uv run python scripts/demo_opslens_web.py --help > /tmp/opslens-reviewer-web-help.txt

      - name: Ruff demo runner
        run: >-
          uv run ruff check
          src/opslens/demo
          scripts/_demo_bootstrap.py
          scripts/demo_opslens.py
          scripts/evaluate_opslens_demo.py
          scripts/demo_opslens_web.py
          scripts/verify_phase19_gate19_10_demo_runner.py
          scripts/verify_phase19_gate19_11_demo_scenarios.py
          scripts/verify_phase19_gate19_12_visual_demo.py
          tests/unit/demo

      - name: Pyright strict demo runner
        run: >-
          uv run pyright
          src/opslens/demo
          scripts/_demo_bootstrap.py
          scripts/demo_opslens.py
          scripts/evaluate_opslens_demo.py
          scripts/demo_opslens_web.py
          scripts/verify_phase19_gate19_10_demo_runner.py
          scripts/verify_phase19_gate19_11_demo_scenarios.py
          scripts/verify_phase19_gate19_12_visual_demo.py
          tests/unit/demo

      - name: Run demo unit tests
        run: uv run pytest tests/unit/demo

      - name: Verify retained Gate 19.10 contract
        run: uv run python scripts/verify_phase19_gate19_10_demo_runner.py

      - name: Verify Gate 19.11 scenario contract
        run: uv run python scripts/verify_phase19_gate19_11_demo_scenarios.py

      - name: Verify Gate 19.12 local visual-demo contract
        run: uv run python scripts/verify_phase19_gate19_12_visual_demo.py

      - name: Prove every scenario JSON is byte stable
        run: |
          for scenario in material-vulnerability controlled-benign fail-closed-incomplete-evidence; do
            uv run python scripts/demo_opslens.py --scenario "$scenario" --format json > "/tmp/$scenario-a.json"
            uv run python scripts/demo_opslens.py --scenario "$scenario" --format json > "/tmp/$scenario-b.json"
            cmp "/tmp/$scenario-a.json" "/tmp/$scenario-b.json"
          done

      - name: Prove suite evaluation JSON is byte stable
        run: |
          uv run python scripts/evaluate_opslens_demo.py --format json > /tmp/opslens-suite-a.json
          uv run python scripts/evaluate_opslens_demo.py --format json > /tmp/opslens-suite-b.json
          cmp /tmp/opslens-suite-a.json /tmp/opslens-suite-b.json

      - name: Run human-readable demo projections
        run: |
          uv run python scripts/demo_opslens.py --scenario material-vulnerability --format text
          uv run python scripts/demo_opslens.py --scenario controlled-benign --format text
          uv run python scripts/demo_opslens.py --scenario fail-closed-incomplete-evidence --format text
          uv run python scripts/evaluate_opslens_demo.py --format text
