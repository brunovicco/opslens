name: V1 Demo Runner CI

on:
  pull_request:
    paths:
      - "src/opslens/demo/**"
      - "tests/unit/demo/**"
      - "scripts/demo_opslens.py"
      - "scripts/verify_phase19_gate19_10_demo_runner.py"
      - "docs/demo/**"
      - "docs/current-state.md"
      - "docs/roadmap.md"
      - "labs/phase-19-gate-19-10-*.md"
      - "labs/evidence/phase-19-gate-19-10-*.json"
      - ".github/workflows/v1-demo-runner-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v1-demo-runner:
    name: Verify Gate 19.10 deterministic demo runner
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff demo runner
        run: >-
          uv run ruff check
          src/opslens/demo
          scripts/demo_opslens.py
          scripts/verify_phase19_gate19_10_demo_runner.py
          tests/unit/demo

      - name: Pyright strict demo runner
        run: >-
          uv run pyright
          src/opslens/demo
          scripts/demo_opslens.py
          scripts/verify_phase19_gate19_10_demo_runner.py
          tests/unit/demo

      - name: Run demo unit tests
        run: uv run pytest tests/unit/demo

      - name: Verify Gate 19.10 contract
        run: uv run python scripts/verify_phase19_gate19_10_demo_runner.py

      - name: Prove canonical JSON byte stability
        run: |
          uv run python scripts/demo_opslens.py --scenario material-vulnerability --format json > /tmp/opslens-demo-a.json
          uv run python scripts/demo_opslens.py --scenario material-vulnerability --format json > /tmp/opslens-demo-b.json
          cmp /tmp/opslens-demo-a.json /tmp/opslens-demo-b.json

      - name: Run human-readable demo projection
        run: uv run python scripts/demo_opslens.py --scenario material-vulnerability --format text
