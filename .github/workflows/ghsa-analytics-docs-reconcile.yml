name: GHSA Analytics Docs Reconcile

on:
  push:
    branches:
      - phase-2-ghsa-analytics
    paths:
      - ".github/workflows/ghsa-analytics-docs-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reconcile public documentation
        run: python .github/scripts/ghsa_analytics_docs_reconcile.py

      - name: Validate diff
        run: |
          git diff --check
          git diff -- README.md README.pt-br.md docs/README.md docs/architecture.md docs/architecture.pt-br.md docs/labs/phase-2-ghsa-glue-athena-design.md

      - name: Commit reconciliation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.pt-br.md docs/README.md docs/architecture.md docs/architecture.pt-br.md docs/labs/phase-2-ghsa-glue-athena-design.md
          git commit -m "docs(phase-2): close GHSA Glue Athena analytics"
          git push origin HEAD:phase-2-ghsa-analytics
