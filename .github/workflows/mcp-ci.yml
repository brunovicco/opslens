name: MCP CI

on:
  pull_request:
    paths:
      - "src/opslens/mcp_boundary/**/*.py"
      - "tests/unit/mcp_boundary/**/*.py"
      - "docs/adr/0047-*.md"
      - "docs/adr/0048-*.md"
      - "labs/phase-13-gate-13-*.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-quality:
    name: MCP quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Verify official MCP SDK pin
        run: >-
          uv run python -c "from importlib.metadata import version;
          assert version('mcp') == '2.2.0', version('mcp')"

      - name: Smoke MCP boundary import
        run: PYTHONPATH=src uv run python -c "import opslens.mcp_boundary"

      - name: Ruff MCP slice
        run: uv run ruff check src/opslens/mcp_boundary tests/unit/mcp_boundary

      - name: Pyright strict MCP slice
        run: uv run pyright src/opslens/mcp_boundary tests/unit/mcp_boundary

      - name: Pytest MCP slice
        run: uv run pytest tests/unit/mcp_boundary
