name: Operational Recovery CI

on:
  pull_request:
    paths:
      - "infra/environments/dev/*.tf"
      - "scripts/verify_operational_recovery.py"
      - ".github/workflows/operational-recovery-ci.yml"
      - "docs/adr/0069-bounded-scheduled-ingestion-pause.md"
      - "docs/runbooks/scheduled-ingestion-pause.md"
      - "labs/phase-17-gate-17-6-operational-recovery.md"
      - "labs/evidence/phase-17-gate-17-6-operational-recovery-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-ingestion-recovery:
    name: Scheduled ingestion recovery invariants
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify operational recovery invariants
        run: python3 scripts/verify_operational_recovery.py
