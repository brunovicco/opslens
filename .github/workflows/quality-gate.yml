name: Quality Gate

# Unlike the per-slice workflows, this one carries no `paths` filter. Every pull
# request runs lint, strict typing and the complete test suite over the whole
# repository, so a module without its own slice job cannot regress unobserved.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: Repository-wide quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff across the whole repository
        run: uv run ruff check .

      - name: Pyright strict across src and tests
        run: uv run pyright

      - name: Pytest across the whole suite
        run: uv run pytest

  import-smoke:
    name: Every module imports
    runs-on: ubuntu-latest

    # Annotations are evaluated at runtime in this codebase (TID251 bans
    # `from __future__ import annotations`), so an unquoted forward reference
    # is an import-time failure. Importing every module makes that immediate
    # rather than deferred to whichever test first touches the module.
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Import every opslens module
        run: uv run python scripts/verify_module_imports.py

  repository-invariants:
    name: Every standing verifier passes
    runs-on: ubuntu-latest

    # `scripts/` holds 28 files named verify_*.py and they are two kinds of tool.
    # Twenty-three are standing verifiers that take no argument and must pass on
    # any change; five are evidence admission tools that require a plan, manifest
    # or measurement artifact and cannot pass on their own. Before this job the
    # only place that distinction existed was in whichever per-slice workflow
    # happened to list a verifier — so a verifier no workflow listed ran nowhere,
    # and running everything looked like five broken gates.
    #
    # This job runs the standing set with no paths filter, and lints and strictly
    # types all 28, which the hand-written per-slice lists did not.
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The Gate 19.5 verifier rebuilds from a pinned commit, so it needs
          # more than the tip. Fetching everything is cheaper than the extra
          # fetch it would otherwise perform.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff every verifier
        run: uv run ruff check scripts/verify_*.py scripts/run_repository_invariants.py

      - name: Pyright strict on every verifier
        run: uv run pyright scripts/verify_*.py scripts/run_repository_invariants.py

      - name: Report the verifier classification
        run: uv run python scripts/run_repository_invariants.py --list

      - name: Run every standing verifier
        env:
          PYTHONPATH: src
        run: uv run python scripts/run_repository_invariants.py

  package-build:
    name: The package builds and the wheel is the same code
    runs-on: ubuntu-latest

    # Declaring a build backend commits the repository to staying installable.
    # The decisive assertion is the last one: the evaluation identity produced by
    # the installed wheel, run from a directory with no checkout on the path, must
    # equal the one the repository produces. If the wheel ever ships different
    # code, that digest moves and this job fails.
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Build the sdist and the wheel
        run: uv build --out-dir dist

      - name: Assert the wheel ships the package and nothing else
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("opslens-*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          version = wheel.name.split("-")[1]
          top = sorted({name.split("/")[0] for name in names})
          assert top == ["opslens", f"opslens-{version}.dist-info"], top
          assert "opslens/py.typed" in names, "py.typed is not shipped"
          assert any("licenses/LICENSE" in name for name in names), "LICENSE is not shipped"
          print(f"{wheel.name}: {len(names)} entries, top level {top}")
          PY

      - name: Install the wheel into an environment with no checkout on the path
        run: |
          uv venv /tmp/pkgcheck
          uv pip install --python /tmp/pkgcheck/bin/python dist/opslens-*.whl

      - name: Assert every console script is installed
        run: |
          for command in opslens-demo opslens-demo-evaluate opslens-demo-web; do
            test -x "/tmp/pkgcheck/bin/$command" || { echo "missing $command" >&2; exit 1; }
            printf 'installed: %s\n' "$command"
          done

      - name: Assert the installed wheel is byte-identical in behaviour
        working-directory: /tmp
        run: >-
          /tmp/pkgcheck/bin/opslens-demo-evaluate --format text
          | grep -qF
          'opslens-demo-suite-evaluation:v1@sha256:deac5a84623cbac84501c09022651386bf10e973a1cd9fa411d7693e1346d3a9'

  quickstart-smoke:
    name: README quickstart on a clean clone
    runs-on: ubuntu-latest

    # Runs the documented reviewer path verbatim against current uv, with no
    # cached environment. `required-version = "==0.12.10"` previously made this
    # path fail on the first command for anyone whose uv came from a package
    # manager; nothing in CI exercised the README, so it went unnoticed.
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6

      - name: Report the uv version under test
        run: uv --version

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Run the canonical scenario
        run: >-
          uv run python scripts/demo_opslens.py
          --scenario material-vulnerability --format text

      - name: Assert the deterministic suite evaluation identity
        run: >-
          uv run python scripts/evaluate_opslens_demo.py --format text
          | grep -qF
          'opslens-demo-suite-evaluation:v1@sha256:deac5a84623cbac84501c09022651386bf10e973a1cd9fa411d7693e1346d3a9'
