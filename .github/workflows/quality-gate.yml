name: Quality Gate

# Unlike the per-slice workflows, this one carries no `paths` filter. Every pull
# request runs lint, strict typing and the complete test suite over the whole
# repository, so a module without its own slice job cannot regress unobserved.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: Repository-wide quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff across the whole repository
        run: uv run ruff check .

      - name: Pyright strict across src and tests
        run: uv run pyright

      - name: Pytest across the whole suite
        run: uv run pytest

  import-smoke:
    name: Every module imports
    runs-on: ubuntu-latest

    # Annotations are evaluated at runtime in this codebase (TID251 bans
    # `from __future__ import annotations`), so an unquoted forward reference
    # is an import-time failure. Importing every module makes that immediate
    # rather than deferred to whichever test first touches the module.
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Import every opslens module
        run: uv run python scripts/verify_module_imports.py
