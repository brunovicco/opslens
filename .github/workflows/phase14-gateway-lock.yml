name: phase14-gateway-lock

on:
  push:
    branches: [feat/governed-gateway-semantic-planner]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/governed-gateway-semantic-planner
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
      - run: uv lock
      - run: uv lock --check
      - name: Commit lock and remove one-shot workflow
        run: |
          rm .github/workflows/phase14-gateway-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock .github/workflows/phase14-gateway-lock.yml
          git commit -m "build: lock governed gateway planner dependencies"
          git push origin HEAD:feat/governed-gateway-semantic-planner
