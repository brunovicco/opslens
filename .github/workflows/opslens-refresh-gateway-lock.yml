name: opslens-refresh-gateway-lock

on:
  push:
    branches:
      - feat/governed-gateway-semantic-planner
    paths:
      - .github/workflows/opslens-refresh-gateway-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-gateway-semantic-planner
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.13
      - name: Refresh lock
        run: |
          uv lock
          uv lock --check
      - name: Commit refreshed lock and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/opslens-refresh-gateway-lock.yml
          git add uv.lock
          git commit -m "build: refresh governed gateway lock"
          git push origin HEAD:feat/governed-gateway-semantic-planner
