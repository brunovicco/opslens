name: EPSS History Backfill

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Execute the frozen 1,939-snapshot backfill (default is plan-only)"
        required: true
        type: boolean
        default: false
      confirmation:
        description: "Execution only: enter EPSS-HISTORY-FULL-1939 exactly"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  epss-history-backfill:
    name: Historical EPSS full backfill
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      EPSS_DATA_BUCKET: opslens-dev-data-487757851499-us-east-1
      EPSS_HISTORY_TRANSFORMER_FUNCTION: opslens-dev-epss-history-transformer

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Configure bounded coordinator credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::487757851499:role/OpsLensEpssHistoryCoordinatorRole
          aws-region: us-east-1
          allowed-account-ids: 487757851499

      - name: Plan frozen full backfill read-only
        if: ${{ !inputs.execute }}
        run: PYTHONPATH=src uv run python scripts/run_epss_history_backfill.py

      - name: Validate exact full-backfill confirmation
        if: ${{ inputs.execute }}
        env:
          BACKFILL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$BACKFILL_CONFIRMATION" = "EPSS-HISTORY-FULL-1939" || {
            echo "Execution requires the exact confirmation EPSS-HISTORY-FULL-1939" >&2
            exit 1
          }

      - name: Execute all 1,939 snapshots sequentially
        if: ${{ inputs.execute }}
        env:
          BACKFILL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          PYTHONPATH=src uv run python scripts/run_epss_history_backfill.py \
            --execute \
            --confirmation "$BACKFILL_CONFIRMATION"
