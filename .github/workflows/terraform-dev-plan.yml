name: Terraform Dev Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Build EPSS Lambda package
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/build_lambda_package.py

      - name: Build EPSS history transformer Lambda package
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/build_epss_history_transformer_lambda_package.py

      - name: Build KEV Lambda package
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/build_kev_lambda_package.py

      - name: Build NVD Bootstrap Lambda package
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/build_nvd_lambda_package.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::487757851499:role/OpsLensGitHubDeployRole
          aws-region: us-east-1
          allowed-account-ids: 487757851499

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -lock-timeout=30s
