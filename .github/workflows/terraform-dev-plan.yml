name: Terraform Dev Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Build EPSS Lambda package
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/build_lambda_package.py

      - name: Build EPSS history transformer Lambda package
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/build_epss_history_transformer_lambda_package.py

      - name: Build KEV Lambda package
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/build_kev_lambda_package.py

      - name: Build NVD Bootstrap Lambda package
        working-directory: ${{ github.workspace }}
        run: uv run python scripts/build_nvd_lambda_package.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::487757851499:role/OpsLensGitHubDeployRole
          aws-region: us-east-1
          allowed-account-ids: 487757851499

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -lock-timeout=30s
