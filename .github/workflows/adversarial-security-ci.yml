name: Adversarial Security CI

on:
  pull_request:
    paths:
      - "src/opslens/public_analysis/**/*.py"
      - "src/opslens/knowledge_retrieval/**/*.py"
      - "src/opslens/agent_baseline/**/*.py"
      - "src/opslens/multi_agent/**/*.py"
      - "src/opslens/mcp_boundary/**/*.py"
      - "src/opslens/a2a_boundary/**/*.py"
      - "tests/security_hardening/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/adversarial-security-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-authority-boundaries:
    name: Adversarial authority boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff adversarial test slice
        run: uv run ruff check tests/security_hardening

      - name: Pyright strict adversarial test slice
        run: uv run pyright tests/security_hardening

      - name: Run adversarial authority suite
        run: uv run pytest tests/security_hardening/test_adversarial_boundaries.py
