name: Single-Agent CI

on:
  pull_request:
    paths:
      - "src/opslens/agent_baseline/**/*.py"
      - "tests/unit/agent_baseline/**/*.py"
      - "tests/fixtures/agent_baseline/**"
      - "scripts/run_single_agent_reasoning_baseline.py"
      - "docs/adr/0036-*.md"
      - "docs/adr/0037-*.md"
      - "docs/adr/0038-*.md"
      - "docs/adr/0039-*.md"
      - "docs/adr/0040-*.md"
      - "docs/adr/0041-*.md"
      - "labs/phase-11-gate-11-*.md"
      - "labs/evidence/README.md"
      - "labs/evidence/phase-11-gate-11-4-*.json"
      - ".github/workflows/single-agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-agent-quality:
    name: Single-agent quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Smoke local reasoning entrypoint
        run: PYTHONPATH=src uv run python scripts/run_single_agent_reasoning_baseline.py --help

      - name: Ruff single-agent slice
        run: >-
          uv run ruff check
          src/opslens/agent_baseline
          tests/unit/agent_baseline
          scripts/run_single_agent_reasoning_baseline.py

      - name: Pyright strict single-agent slice
        run: >-
          uv run pyright
          src/opslens/agent_baseline
          tests/unit/agent_baseline
          scripts/run_single_agent_reasoning_baseline.py

      - name: Pytest single-agent slice
        run: uv run pytest tests/unit/agent_baseline
