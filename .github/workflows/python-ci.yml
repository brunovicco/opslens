name: Python CI

on:
  pull_request:
    paths:
      - "src/opslens/correlation/**/*.py"
      - "tests/unit/correlation/**/*.py"
      - "tests/fixtures/correlation/**"
      - "src/opslens/repository_intelligence/**/*.py"
      - "tests/unit/repository_intelligence/**/*.py"
      - "src/opslens/risk_policy/**/*.py"
      - "tests/unit/risk_policy/**/*.py"
      - "src/opslens/semantic_query/**/*.py"
      - "tests/unit/semantic_query/**/*.py"
      - "src/opslens/knowledge_retrieval/**/*.py"
      - "tests/unit/knowledge_retrieval/**/*.py"
      - "tests/fixtures/knowledge_retrieval/**"
      - "knowledge/corpus/**"
      - "src/opslens/hybrid_retrieval/**/*.py"
      - "tests/unit/hybrid_retrieval/**/*.py"
      - "tests/fixtures/hybrid_retrieval/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correlation-quality:
    name: Correlation quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff correlation slice
        run: uv run ruff check src/opslens/correlation tests/unit/correlation

      - name: Pyright strict correlation slice
        run: uv run pyright src/opslens/correlation tests/unit/correlation

      - name: Pytest correlation slice
        run: uv run pytest tests/unit/correlation

