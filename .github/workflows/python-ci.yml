name: Python CI

# Fast per-slice feedback. The repository-wide gate lives in quality-gate.yml
# and carries no `paths` filter, so a module missing from this matrix is still
# linted, typed and tested on every pull request.

on:
  pull_request:
    paths:
      - "src/opslens/**/*.py"
      - "tests/unit/**/*.py"
      - "tests/fixtures/**"
      - "knowledge/corpus/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice-quality:
    name: ${{ matrix.slice }} quality gates
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        slice:
          - correlation
          - repository_intelligence
          - risk_policy
          - semantic_query
          - knowledge_retrieval
          - hybrid_retrieval
          - public_analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff ${{ matrix.slice }} slice
        run: uv run ruff check src/opslens/${{ matrix.slice }} tests/unit/${{ matrix.slice }}

      - name: Pyright strict ${{ matrix.slice }} slice
        run: uv run pyright src/opslens/${{ matrix.slice }} tests/unit/${{ matrix.slice }}

      - name: Pytest ${{ matrix.slice }} slice
        run: uv run pytest tests/unit/${{ matrix.slice }}
