name: AgentCore CI

on:
  pull_request:
    paths:
      - "src/opslens/agentcore_runtime/**/*.py"
      - "tests/unit/agentcore_runtime/**/*.py"
      - "tests/fixtures/agentcore_runtime/**"
      - "scripts/build_agentcore_runtime_package.py"
      - "scripts/publish_agentcore_runtime_artifact.py"
      - "scripts/run_agentcore_runtime_replay.py"
      - "runtime/agentcore/**"
      - "docs/adr/005*.md"
      - "labs/phase-14-gate-14-*.md"
      - "labs/evidence/phase-14-*.json"
      - "infra/modules/agentcore_runtime/**"
      - "infra/environments/dev/agentcore*.tf"
      - "infra/bootstrap/github_agentcore*.tf"
      - "README.md"
      - "README.pt-br.md"
      - "docs/README.md"
      - "docs/current-state.md"
      - "docs/roadmap.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/agentcore-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentcore-quality:
    name: AgentCore quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Validate Phase 14 evidence JSON
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("labs/evidence").glob("phase-14-*.json"))
          if not paths:
              raise SystemExit("No Phase 14 evidence JSON files found.")
          for path in paths:
              with path.open("r", encoding="utf-8") as handle:
                  value = json.load(handle)
              if not isinstance(value, dict):
                  raise SystemExit(f"{path} must contain one JSON object.")
              if not isinstance(value.get("artifact_version"), str):
                  raise SystemExit(f"{path} is missing artifact_version.")
          PY

      - name: Prepare exact locked AWS provider schema probe
        run: |
          uv run python - <<'PY'
          import re
          from pathlib import Path

          lock_path = Path("infra/environments/dev/.terraform.lock.hcl")
          lock_text = lock_path.read_text(encoding="utf-8")
          match = re.search(
              r'provider "registry\.terraform\.io/hashicorp/aws" \{\s+version\s+=\s+"([^"]+)"',
              lock_text,
          )
          if match is None:
              raise SystemExit("Unable to resolve the locked HashiCorp AWS provider version.")

          version = match.group(1)
          probe_dir = Path("/tmp/opslens-agentcore-provider-schema")
          probe_dir.mkdir(parents=True, exist_ok=True)
          (probe_dir / "main.tf").write_text(
              "terraform {\n"
              "  required_providers {\n"
              "    aws = {\n"
              "      source  = \"hashicorp/aws\"\n"
              f"      version = \"= {version}\"\n"
              "    }\n"
              "  }\n"
              "}\n",
              encoding="utf-8",
          )
          print(f"locked_aws_provider_version={version}")
          PY

      - name: Initialize exact locked AWS provider schema probe
        run: >-
          terraform -chdir=/tmp/opslens-agentcore-provider-schema init
          -backend=false
          -input=false

      - name: Verify exact locked AWS provider exposes AgentCore Runtime
        run: |
          terraform -chdir=/tmp/opslens-agentcore-provider-schema providers schema -json > /tmp/opslens-provider-schema.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path("/tmp/opslens-provider-schema.json").read_text(encoding="utf-8"))
          aws = schema["provider_schemas"]["registry.terraform.io/hashicorp/aws"]
          resources = aws["resource_schemas"]
          resource_name = "aws_bedrockagentcore_agent_runtime"
          if resource_name not in resources:
              raise SystemExit(
                  f"Exact locked AWS provider does not expose {resource_name}."
              )
          print(f"verified_resource={resource_name}")
          PY

      - name: Ruff AgentCore slice
        run: >-
          uv run ruff check
          src/opslens/agentcore_runtime
          tests/unit/agentcore_runtime
          scripts/build_agentcore_runtime_package.py
          scripts/publish_agentcore_runtime_artifact.py
          scripts/run_agentcore_runtime_replay.py
          runtime/agentcore/main.py

      - name: Pyright strict AgentCore slice
        run: >-
          uv run pyright
          src/opslens/agentcore_runtime
          tests/unit/agentcore_runtime
          scripts/build_agentcore_runtime_package.py
          scripts/publish_agentcore_runtime_artifact.py
          scripts/run_agentcore_runtime_replay.py
          runtime/agentcore/main.py

      - name: Pytest AgentCore slice
        run: uv run pytest tests/unit/agentcore_runtime

      - name: Build reproducible AgentCore direct-code packages
        run: |
          uv run python scripts/build_agentcore_runtime_package.py \
            --output-dir /tmp/opslens-agentcore-package-a \
            > /tmp/opslens-agentcore-package-a.json
          uv run python scripts/build_agentcore_runtime_package.py \
            --output-dir /tmp/opslens-agentcore-package-b \
            > /tmp/opslens-agentcore-package-b.json
          if ! cmp -s \
            /tmp/opslens-agentcore-package-a/opslens-agentcore-runtime.zip \
            /tmp/opslens-agentcore-package-b/opslens-agentcore-runtime.zip; then
            uv run python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          zip_a = Path("/tmp/opslens-agentcore-package-a/opslens-agentcore-runtime.zip")
          zip_b = Path("/tmp/opslens-agentcore-package-b/opslens-agentcore-runtime.zip")

          def members(path: Path) -> dict[str, tuple[int, int, str]]:
              with ZipFile(path) as archive:
                  return {
                      info.filename: (
                          info.file_size,
                          info.CRC,
                          hashlib.sha256(archive.read(info.filename)).hexdigest(),
                      )
                      for info in archive.infolist()
                  }

          members_a = members(zip_a)
          members_b = members(zip_b)
          only_a = sorted(set(members_a) - set(members_b))
          only_b = sorted(set(members_b) - set(members_a))
          changed = sorted(
              name
              for name in set(members_a) & set(members_b)
              if members_a[name] != members_b[name]
          )
          print(f"zip_a_sha256={hashlib.sha256(zip_a.read_bytes()).hexdigest()}")
          print(f"zip_b_sha256={hashlib.sha256(zip_b.read_bytes()).hexdigest()}")
          print(f"only_in_a={only_a}")
          print(f"only_in_b={only_b}")
          for name in changed[:20]:
              print(
                  "changed_member="
                  f"{name} a={members_a[name]} b={members_b[name]}"
              )
          raise SystemExit("AgentCore direct-code ZIP is not byte reproducible")
          PY
          fi
          cmp \
            /tmp/opslens-agentcore-package-a/opslens-agentcore-runtime-package.json \
            /tmp/opslens-agentcore-package-b/opslens-agentcore-runtime-package.json
          cat /tmp/opslens-agentcore-package-a/opslens-agentcore-runtime-package.json
