name: AgentCore CI

on:
  pull_request:
    paths:
      - "src/opslens/agentcore_runtime/**/*.py"
      - "tests/unit/agentcore_runtime/**/*.py"
      - "tests/fixtures/agentcore_runtime/**"
      - "docs/adr/0052-*.md"
      - "labs/phase-14-gate-14-*.md"
      - "labs/evidence/phase-14-*.json"
      - "infra/modules/agentcore_runtime/**"
      - "infra/environments/dev/agentcore*.tf"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/agentcore-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentcore-quality:
    name: AgentCore quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Validate Phase 14 evidence JSON
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("labs/evidence").glob("phase-14-*.json"))
          if not paths:
              raise SystemExit("No Phase 14 evidence JSON files found.")
          for path in paths:
              with path.open("r", encoding="utf-8") as handle:
                  value = json.load(handle)
              if not isinstance(value, dict):
                  raise SystemExit(f"{path} must contain one JSON object.")
              if not isinstance(value.get("artifact_version"), str):
                  raise SystemExit(f"{path} is missing artifact_version.")
          PY

      - name: Initialize dev provider schema without backend
        run: >-
          terraform -chdir=infra/environments/dev init
          -backend=false
          -input=false
          -lockfile=readonly

      - name: Verify locked AWS provider exposes AgentCore Runtime
        run: |
          terraform -chdir=infra/environments/dev providers schema -json > /tmp/opslens-provider-schema.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path("/tmp/opslens-provider-schema.json").read_text(encoding="utf-8"))
          aws = schema["provider_schemas"]["registry.terraform.io/hashicorp/aws"]
          resources = aws["resource_schemas"]
          if "aws_bedrockagentcore_agent_runtime" not in resources:
              raise SystemExit("Locked AWS provider does not expose aws_bedrockagentcore_agent_runtime.")
          PY

      - name: Ruff AgentCore slice
        run: |
          if [ -d src/opslens/agentcore_runtime ]; then
            uv run ruff check src/opslens/agentcore_runtime tests/unit/agentcore_runtime
          else
            echo "AgentCore Python slice not introduced yet; Gate 14.1 is architecture/evidence only."
          fi

      - name: Pyright strict AgentCore slice
        run: |
          if [ -d src/opslens/agentcore_runtime ]; then
            uv run pyright src/opslens/agentcore_runtime tests/unit/agentcore_runtime
          else
            echo "AgentCore Python slice not introduced yet; Gate 14.1 is architecture/evidence only."
          fi

      - name: Pytest AgentCore slice
        run: |
          if [ -d tests/unit/agentcore_runtime ]; then
            uv run pytest tests/unit/agentcore_runtime
          else
            echo "AgentCore unit-test slice not introduced yet; Gate 14.1 is architecture/evidence only."
          fi
