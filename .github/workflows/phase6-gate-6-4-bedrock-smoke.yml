name: Phase 6 Gate 6.4 Bedrock Smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bedrock-smoke:
    name: Bounded Bedrock planner smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Configure bounded AWS identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::487757851499:role/OpsLensBedrockSmokeRole
          aws-region: us-east-1
          allowed-account-ids: 487757851499

      - name: Invoke frozen planner once
        run: uv run python scripts/run_bedrock_planner_smoke.py
