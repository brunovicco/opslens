name: Operational Observability CI

on:
  pull_request:
    paths:
      - "src/opslens/shared/observability/**/*.py"
      - "tests/unit/shared/observability/**/*.py"
      - ".github/workflows/operational-observability-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-observability-quality:
    name: Operational observability quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff operational observability slice
        run: >-
          uv run ruff check
          src/opslens/shared/observability
          tests/unit/shared/observability

      - name: Pyright strict operational observability slice
        run: >-
          uv run pyright
          src/opslens/shared/observability
          tests/unit/shared/observability

      - name: Pytest operational observability slice
        run: uv run pytest tests/unit/shared/observability
