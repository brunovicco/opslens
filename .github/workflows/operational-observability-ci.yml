name: Operational Observability CI

on:
  pull_request:
    paths:
      - "src/opslens/shared/observability/**/*.py"
      - "tests/unit/shared/observability/**/*.py"
      - ".github/workflows/operational-observability-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-observability-quality:
    name: Operational observability quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff operational observability slice
        run: >-
          uv run ruff check
          src/opslens/shared/observability
          tests/unit/shared/observability

      - name: Pyright strict operational observability slice
        run: >-
          uv run pyright
          src/opslens/shared/observability
          tests/unit/shared/observability

      - name: Pytest operational observability slice
        run: uv run pytest tests/unit/shared/observability
