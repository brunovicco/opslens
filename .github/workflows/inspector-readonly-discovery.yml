name: Inspector Read-Only Discovery

on:
  workflow_dispatch:
    inputs:
      confirm_temporary_role_exists:
        description: "Confirm a separately authorized temporary Inspector discovery role exists"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  inspector-discovery:
    name: Bounded Inspector read-only discovery
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_temporary_role_exists == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Configure temporary read-only Inspector credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::487757851499:role/OpsLensInspectorDiscoveryRole
          role-duration-seconds: 900
          aws-region: us-east-1
          allowed-account-ids: 487757851499

      - name: Run bounded read-only Inspector discovery
        run: |
          PYTHONPATH=src uv run python scripts/run_inspector_readonly_discovery.py \
            --region us-east-1 \
            --expected-account-id 487757851499 \
            | tee /tmp/opslens-inspector-readonly-discovery.json

      - name: Validate zero-mutation evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/opslens-inspector-readonly-discovery.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          if value["contract_version"] != "inspector-readonly-discovery:v1":
              raise SystemExit("unexpected Inspector discovery contract")
          if value["result"] not in {"SUCCESS", "BLOCKED_BY_EXISTING_IAM"}:
              raise SystemExit(f"unexpected discovery result: {value['result']}")
          for key in (
              "aws_mutation_count",
              "new_iam_count",
              "model_invocations",
              "capability_executions",
          ):
              if value[key] != 0:
                  raise SystemExit(f"Inspector discovery authority widened: {key}={value[key]}")
          if value["coverage"]["attempted"] is not True:
              raise SystemExit("ListCoverage must be attempted")
          if value["result"] == "BLOCKED_BY_EXISTING_IAM":
              blocked = [value["coverage"], value["findings"]]
              if not any(item["outcome"] == "ACCESS_DENIED" for item in blocked):
                  raise SystemExit("blocked result requires AccessDenied evidence")
          PY

      - name: Preserve discovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-16-gate-16-4-inspector-readonly-${{ github.run_id }}
          path: /tmp/opslens-inspector-readonly-discovery.json
          if-no-files-found: error
          retention-days: 14
