name: EPSS History Sample Probe Validation

on:
  push:
    branches:
      - phase-2-epss-history
    paths:
      - ".github/workflows/epss-history-sample-probe-validation.yml"
      - "scripts/probe_epss_history_samples.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6

      - name: Sync frozen dependencies
        run: uv sync --frozen

      - name: Ruff sample probe
        run: uv run ruff check scripts/probe_epss_history_samples.py

      - name: Compile sample probe
        run: uv run python -m py_compile scripts/probe_epss_history_samples.py

      - name: Run immutable five-era sample probe
        env:
          PYTHONPATH: src
        run: |
          uv run python scripts/probe_epss_history_samples.py \
            --commit 7ba701f5599057c496489ceecd701cbd43911f5c \
            | tee /tmp/epss-history-samples.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/epss-history-samples.json').read_text())
          assert data['sample_count'] == 5
          assert data['third_party_code_executed'] is False
          assert data['source_data_files_downloaded'] == 5
          assert data['current_parser_rejected_eras'] == ['v1']
          assert data['current_parser_accepted_eras'] == ['v2', 'v3', 'v4', 'v5']
          assert all(item['exact_blob_identity_verified'] for item in data['samples'])
          print('EPSS_HISTORY_REPRESENTATIVE_SOURCE_COMPATIBILITY_GATE=PASS')
          PY
