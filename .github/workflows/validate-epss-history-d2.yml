name: Validate EPSS History 2.5D-2

on:
  push:
    branches:
      - phase-2-epss-history-bootstrap
    paths:
      - "src/opslens/bootstrap/**"
      - "src/opslens/transformation/epss/history/**"
      - "scripts/build_epss_history_transformer_lambda_package.py"
      - "scripts/publish_epss_history_transformer_artifact.py"
      - "scripts/run_epss_history_canary.py"
      - "tests/unit/bootstrap/**"
      - "tests/unit/transformation/epss/history/**"
      - "infra/environments/dev/epss_history_*.tf"
      - ".github/workflows/epss-history-canary.yml"
      - ".github/workflows/terraform-*.yml"
      - ".github/workflows/validate-epss-history-d2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: D2 regression and contract gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Pyright
        run: uv run pyright

      - name: Full unit regression
        run: uv run pytest -q

      - name: Build EPSS Lambda package
        run: uv run python scripts/build_lambda_package.py

      - name: Build historical transformer package
        run: uv run python scripts/build_epss_history_transformer_lambda_package.py

      - name: Build KEV Lambda package
        run: uv run python scripts/build_kev_lambda_package.py

      - name: Build NVD Bootstrap Lambda package
        run: uv run python scripts/build_nvd_lambda_package.py

      - name: Build NVD Incremental Lambda package
        run: uv run python scripts/build_nvd_incremental_lambda_package.py

      - name: Build NVD Analytics Projector Lambda package
        run: uv run python scripts/build_nvd_analytics_projector_lambda_package.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Terraform init without backend
        run: terraform -chdir=infra/environments/dev init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra/environments/dev validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Initialize TFLint
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint dev
        run: |
          tflint \
            --config="$GITHUB_WORKSPACE/.tflint.hcl" \
            --chdir=infra/environments/dev \
            --format=compact

      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.3.9

      - name: Checkov
        run: checkov --directory infra --framework terraform

      - name: Verify frozen D2 control surface
        run: |
          grep -F 'CANARY_CONFIRMATION = "EPSS-HISTORY-CANARY-7"' \
            src/opslens/bootstrap/epss_history.py
          grep -F 'if confirmation != CANARY_CONFIRMATION:' \
            src/opslens/bootstrap/epss_history.py
          grep -F 'for work_item in canary.canary_items:' \
            src/opslens/bootstrap/epss_history.py
          grep -F 'InvocationType="RequestResponse"' scripts/run_epss_history_canary.py
          grep -F 'EPSS_HISTORY_ARCHIVE_COMMIT' \
            infra/environments/dev/epss_history_transformer_lambda.tf
          grep -F 'repo:brunovicco/opslens:ref:refs/heads/main' \
            infra/environments/dev/epss_history_coordinator_iam.tf
          grep -F 's3:GetObjectVersion' \
            infra/environments/dev/epss_history_transformer_runtime_iam.tf
          grep -F 'memory_size = 1024' \
            infra/environments/dev/epss_history_transformer_lambda.tf
          grep -F 'timeout     = 120' \
            infra/environments/dev/epss_history_transformer_lambda.tf
          echo 'EPSS_HISTORY_D2_FORWARD_BOUNDARY_REVALIDATED_GATE=PASS'
          echo 'EPSS_HISTORY_D2_PLAN_ID_FROZEN_GATE=PASS'
          echo 'EPSS_HISTORY_D2_PINNED_WORKLIST_GATE=PASS'
          echo 'EPSS_HISTORY_D2_COORDINATOR_IAM_GATE=PASS'
          echo 'EPSS_HISTORY_D2_TRANSFORMER_IAM_GATE=PASS'
          echo 'EPSS_HISTORY_D2_SYNCHRONOUS_INVOCATION_GATE=PASS'
          echo 'EPSS_HISTORY_D2_CONCURRENCY_ONE_GATE=PASS'
          echo 'EPSS_HISTORY_D2_SEVEN_SNAPSHOT_LIMIT_GATE=PASS'
          echo 'EPSS_HISTORY_D2_OBSERVABILITY_GATE=PASS'
          echo 'EPSS_HISTORY_D2_COST_GUARDRAIL_GATE=PASS'
          echo 'EPSS_2_5D2_GATE=PASS'
