name: Public Runtime Readiness CI

on:
  pull_request:
    paths:
      - "src/opslens/public_analysis/**/*.py"
      - "src/opslens/repository_intelligence/**/*.py"
      - "src/opslens/semantic_query/**/*.py"
      - "src/opslens/knowledge_retrieval/**/*.py"
      - "src/opslens/hybrid_retrieval/**/*.py"
      - "tests/unit/public_analysis/**/*.py"
      - "tests/fixtures/phase19/**/*.json"
      - "infra/environments/dev/public_async_runtime*.tf"
      - "labs/evidence/phase-19-gate-19-1-*.json"
      - "labs/evidence/phase-19-gate-19-2-*.json"
      - "labs/evidence/phase-19-gate-19-3-*.json"
      - "labs/evidence/phase-19-gate-19-4-*.json"
      - "labs/evidence/phase-19-gate-19-5-*.json"
      - "labs/evidence/phase-19-gate-19-6-*"
      - "labs/evidence/phase-19-gate-19-7-*"
      - "labs/evidence/phase-19-gate-19-8-*"
      - "labs/phase-19-gate-19-1-*.md"
      - "labs/phase-19-gate-19-2-*.md"
      - "labs/phase-19-gate-19-3-*.md"
      - "labs/phase-19-gate-19-4-*.md"
      - "labs/phase-19-gate-19-5-*.md"
      - "labs/phase-19-gate-19-6-*.md"
      - "labs/phase-19-gate-19-7-*.md"
      - "labs/phase-19-gate-19-8-*.md"
      - "docs/adr/0076-*.md"
      - "scripts/build_phase19_async_lambda_artifacts.py"
      - "scripts/publish_phase19_gate19_5_async_artifacts.py"
      - "scripts/verify_phase19_gate19_1_public_runtime_contract.py"
      - "scripts/verify_phase19_gate19_2_measurement_contract.py"
      - "scripts/verify_phase19_gate19_2_live_measurement.py"
      - "scripts/verify_phase19_gate19_2_closeout.py"
      - "scripts/verify_phase19_gate19_3_async_topology_contract.py"
      - "scripts/verify_phase19_gate19_4_disabled_async_runtime.py"
      - "scripts/verify_phase19_gate19_5_async_artifact_build.py"
      - "scripts/verify_phase19_gate19_5_artifact_publication.py"
      - "scripts/verify_phase19_gate19_6_exact_plan.py"
      - "scripts/verify_phase19_gate19_7_materialization_contract.py"
      - "scripts/verify_phase19_gate19_7_fresh_plan.py"
      - "scripts/verify_phase19_gate19_8_threat_evidence_authority.py"
      - "scripts/verify_phase18_closeout.py"
      - "README.md"
      - "README.pt-br.md"
      - "docs/README.md"
      - "docs/current-state.md"
      - "docs/roadmap.md"
      - "docs/architecture.md"
      - "docs/architecture.pt-br.md"
      - ".github/workflows/public-runtime-readiness-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-runtime-readiness:
    name: Phase 19 public runtime readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff Phase 19 verifiers and artifact tooling
        run: >-
          uv run ruff check
          scripts/build_phase19_async_lambda_artifacts.py
          scripts/publish_phase19_gate19_5_async_artifacts.py
          scripts/verify_phase19_gate19_1_public_runtime_contract.py
          scripts/verify_phase19_gate19_2_measurement_contract.py
          scripts/verify_phase19_gate19_2_live_measurement.py
          scripts/verify_phase19_gate19_2_closeout.py
          scripts/verify_phase19_gate19_3_async_topology_contract.py
          scripts/verify_phase19_gate19_4_disabled_async_runtime.py
          scripts/verify_phase19_gate19_5_async_artifact_build.py
          scripts/verify_phase19_gate19_5_artifact_publication.py
          scripts/verify_phase19_gate19_6_exact_plan.py
          scripts/verify_phase19_gate19_7_materialization_contract.py
          scripts/verify_phase19_gate19_7_fresh_plan.py
          scripts/verify_phase19_gate19_8_threat_evidence_authority.py
          scripts/verify_phase18_closeout.py

      - name: Pyright strict Phase 19 verifiers and artifact tooling
        run: >-
          uv run pyright
          scripts/build_phase19_async_lambda_artifacts.py
          scripts/publish_phase19_gate19_5_async_artifacts.py
          scripts/verify_phase19_gate19_1_public_runtime_contract.py
          scripts/verify_phase19_gate19_2_measurement_contract.py
          scripts/verify_phase19_gate19_2_live_measurement.py
          scripts/verify_phase19_gate19_2_closeout.py
          scripts/verify_phase19_gate19_3_async_topology_contract.py
          scripts/verify_phase19_gate19_4_disabled_async_runtime.py
          scripts/verify_phase19_gate19_5_async_artifact_build.py
          scripts/verify_phase19_gate19_5_artifact_publication.py
          scripts/verify_phase19_gate19_6_exact_plan.py
          scripts/verify_phase19_gate19_7_materialization_contract.py
          scripts/verify_phase19_gate19_7_fresh_plan.py
          scripts/verify_phase19_gate19_8_threat_evidence_authority.py
          scripts/verify_phase18_closeout.py

      - name: Run retained public-analysis unit tests
        run: uv run pytest tests/unit/public_analysis

      - name: Verify historical Phase 18 closeout and live post-merge state
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase18_closeout.py

      - name: Verify Gate 19.1 public runtime launch contract
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase19_gate19_1_public_runtime_contract.py

      - name: Verify Gate 19.2 representative measurement contract
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase19_gate19_2_measurement_contract.py

      - name: Verify Gate 19.2 live evidence and async closeout
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase19_gate19_2_closeout.py

      - name: Verify Gate 19.3 concrete async topology contract
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase19_gate19_3_async_topology_contract.py

      - name: Verify Gate 19.4 disabled async runtime implementation
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase19_gate19_4_disabled_async_runtime.py

      - name: Verify Gate 19.5 deterministic async artifact rebuild
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase19_gate19_5_async_artifact_build.py

      - name: Verify Gate 19.5 admitted human artifact publication
        env:
          PYTHONPATH: src
        run: >-
          uv run python scripts/verify_phase19_gate19_5_artifact_publication.py
          --prepublication labs/evidence/phase-19-gate-19-5-prepublication-v1.json
          --publication labs/evidence/phase-19-gate-19-5-artifact-publication-v1.json

      - name: Verify Gate 19.6 exact-plan admission contract offline
        env:
          PYTHONPATH: src
        run: >-
          uv run python scripts/verify_phase19_gate19_6_exact_plan.py
          --plan-json tests/fixtures/phase19/gate19-6-exact-plan-pass.json

      - name: Verify Gate 19.7 disabled-materialization authority offline
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase19_gate19_7_materialization_contract.py

      - name: Verify Gate 19.8 request-time threat authority offline
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase19_gate19_8_threat_evidence_authority.py
