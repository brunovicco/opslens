name: V1 Demonstration Contract CI

on:
  pull_request:
    paths:
      - "README.md"
      - "README.pt-br.md"
      - "docs/README.md"
      - "docs/architecture*.md"
      - "docs/current-state.md"
      - "docs/roadmap.md"
      - "docs/portfolio-evidence.md"
      - "docs/v1-demonstration-scope.md"
      - "docs/v1-completion-checklist.md"
      - "docs/post-v1-backlog.md"
      - "docs/demo/**"
      - "docs/adr/0077-*.md"
      - "labs/phase-19-gate-19-9-*.md"
      - "labs/evidence/phase-19-gate-19-9-*.json"
      - "labs/phase-19-gate-19-13-*.md"
      - "labs/evidence/phase-19-gate-19-13-*.json"
      - "scripts/verify_phase19_gate19_9_v1_demonstration_contract.py"
      - "scripts/verify_phase19_gate19_13_portfolio_polish.py"
      - ".github/workflows/v1-demonstration-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v1-demonstration-contract:
    name: Verify Gate 19.9 V1 demonstration contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff verifier
        run: uv run ruff check scripts/verify_phase19_gate19_9_v1_demonstration_contract.py

      - name: Pyright strict verifier
        run: uv run pyright scripts/verify_phase19_gate19_9_v1_demonstration_contract.py

      - name: Verify Gate 19.9 contract
        run: uv run python scripts/verify_phase19_gate19_9_v1_demonstration_contract.py

  verify-v1-portfolio-polish:
    name: Verify Gate 19.13 V1 portfolio presentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff verifier
        run: uv run ruff check scripts/verify_phase19_gate19_13_portfolio_polish.py

      - name: Pyright strict verifier
        run: uv run pyright scripts/verify_phase19_gate19_13_portfolio_polish.py

      - name: Verify Gate 19.13 portfolio contract
        run: uv run python scripts/verify_phase19_gate19_13_portfolio_polish.py
