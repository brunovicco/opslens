name: GHSA Lock Update

on:
  push:
    branches:
      - phase-2-ghsa-silver-runtime
    paths:
      - ".github/workflows/ghsa-lock-update.yml"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: phase-2-ghsa-silver-runtime
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
      - name: Refresh lock file
        run: uv lock
      - name: Commit lock metadata
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build(phase-2): refresh GHSA Silver lock metadata"
          git push origin HEAD:phase-2-ghsa-silver-runtime
