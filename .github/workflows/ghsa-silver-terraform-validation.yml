name: GHSA Silver Terraform Validation

on:
  push:
    branches:
      - phase-2-ghsa-silver-runtime
    paths:
      - "infra/environments/dev/ghsa_silver_runtime_iam.tf"
      - "infra/environments/dev/ghsa_silver_observability.tf"
      - ".github/workflows/ghsa-silver-terraform-validation.yml"

permissions:
  contents: read

jobs:
  terraform-validation:
    name: GHSA Silver Terraform validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: ${{ github.workspace }}
        run: |
          terraform fmt -check \
            infra/environments/dev/ghsa_silver_runtime_iam.tf \
            infra/environments/dev/ghsa_silver_observability.tf

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate
