name: Validate EPSS History 2.5C-5

on:
  push:
    branches:
      - phase-2-epss-history
    paths:
      - ".github/workflows/validate-epss-history-c5.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Validate lockfile
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check \
            src/opslens/transformation/epss/history \
            src/opslens/transformation/epss/adapters/outbound/s3_history_completion.py \
            src/opslens/transformation/epss/adapters/outbound/s3_history_completion_replay.py \
            tests/unit/transformation/epss/history \
            tests/unit/transformation/epss/adapters/outbound/test_s3_history_completion.py

      - name: Pyright
        run: uv run pyright

      - name: EPSS history regression tests
        run: |
          uv run pytest -q \
            tests/unit/ingestion/epss \
            tests/unit/transformation/epss

      - name: Gate marker
        run: |
          echo "EPSS_HISTORY_COMPLETION_CANONICAL_MANIFEST_GATE=PASS"
          echo "EPSS_HISTORY_COMPLETION_WRITTEN_LAST_GATE=PASS"
          echo "EPSS_HISTORY_COMPLETION_VERSION_ID_GATE=PASS"
          echo "EPSS_HISTORY_COMPLETION_EXACT_REPLAY_GATE=PASS"
          echo "EPSS_HISTORY_EXPLICIT_INVOCATION_ONLY_GATE=PASS"
          echo "EPSS_HISTORY_APPROVED_ARCHIVE_REVISION_GATE=PASS"
          echo "EPSS_HISTORY_FORWARD_AUTHORITY_BOUNDARY_GATE=PASS"
          echo "EPSS_HISTORY_V1_NO_FABRICATED_SILVER_GATE=PASS"
          echo "EPSS_HISTORY_C5_LINT_RERUN_GATE=PASS"
          echo "EPSS_2_5C5_GATE=PASS"
