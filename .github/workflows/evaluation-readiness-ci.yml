name: Evaluation Readiness CI

on:
  pull_request:
    paths:
      - "src/opslens/evaluation_readiness/**/*.py"
      - "scripts/verify_phase18_evidence_inventory.py"
      - "scripts/verify_phase18_consolidated_view.py"
      - "scripts/verify_phase18_cost_accounting.py"
      - "scripts/verify_phase18_portfolio_pack.py"
      - "scripts/verify_phase18_closeout.py"
      - "tests/unit/evaluation_readiness/**/*.py"
      - "labs/evidence/phase-18-gate-18-1-evidence-inventory-v1.json"
      - "labs/evidence/phase-18-gate-18-2-*.json"
      - "labs/evidence/phase-18-gate-18-3-*.json"
      - "labs/evidence/phase-18-gate-18-4-*.json"
      - "labs/evidence/phase-18-closeout-v1.json"
      - "labs/phase-18-gate-18-1-*.md"
      - "labs/phase-18-gate-18-2-*.md"
      - "labs/phase-18-gate-18-3-*.md"
      - "labs/phase-18-gate-18-4-*.md"
      - "labs/phase-18-closeout.md"
      - "README.md"
      - "README.pt-br.md"
      - "docs/README.md"
      - "docs/current-state.md"
      - "docs/roadmap.md"
      - "docs/architecture.md"
      - "docs/architecture.pt-br.md"
      - "docs/portfolio-evidence.md"
      - "docs/aip-c01-learning-map.md"
      - "docs/adr/0071-*.md"
      - "docs/adr/0072-*.md"
      - "docs/adr/0073-*.md"
      - "docs/adr/0074-*.md"
      - "docs/adr/0075-*.md"
      - "docs/adr/README.md"
      - ".github/workflows/evaluation-readiness-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-readiness:
    name: Cross-phase evidence, cost, portfolio, AIP-C01 mapping, and closeout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6
        with:
          enable-cache: true

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Ruff Phase 18 evaluation-readiness slice
        run: >-
          uv run ruff check
          src/opslens/evaluation_readiness
          scripts/verify_phase18_evidence_inventory.py
          scripts/verify_phase18_consolidated_view.py
          scripts/verify_phase18_cost_accounting.py
          scripts/verify_phase18_portfolio_pack.py
          scripts/verify_phase18_closeout.py
          tests/unit/evaluation_readiness

      - name: Pyright strict Phase 18 evaluation-readiness slice
        run: >-
          uv run pyright
          src/opslens/evaluation_readiness
          tests/unit/evaluation_readiness

      - name: Unit-test Phase 18 evaluation-readiness invariants
        run: uv run pytest tests/unit/evaluation_readiness

      - name: Verify canonical cross-phase evidence inventory
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase18_evidence_inventory.py

      - name: Verify consolidated evaluation and reliability view
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase18_consolidated_view.py

      - name: Verify cost accounting and budget envelopes
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase18_cost_accounting.py

      - name: Verify portfolio evidence and AIP-C01 mapping
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase18_portfolio_pack.py

      - name: Verify Phase 18 closeout
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_phase18_closeout.py
