name: EPSS History Evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  epss-history-evidence:
    name: Historical EPSS post-backfill evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      EPSS_DATA_BUCKET: opslens-dev-data-487757851499-us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v6
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Configure read-only evidence credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::487757851499:role/OpsLensEpssHistoryEvidenceRole
          role-duration-seconds: 21600
          aws-region: us-east-1
          allowed-account-ids: 487757851499

      - name: Verify all 1,939 historical snapshots read-only
        run: PYTHONPATH=src uv run python scripts/run_epss_history_evidence.py
