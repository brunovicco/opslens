# OpsLens is a demonstration architecture lab, not a production SaaS. The metadata
# below says so, because published metadata is a claim like any other.
[build-system]
requires = ["uv_build>=0.12.3,<0.14"]
build-backend = "uv_build"

[project]
name = "opslens"
version = "0.1.0"
description = "Deterministic software-supply-chain evidence lab: agents reason, code verifies evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
authors = [{ name = "Bruno Vicco" }]
keywords = [
    "sbom",
    "software-supply-chain",
    "vulnerability-management",
    "evidence",
    "determinism",
    "hexagonal-architecture",
    "bedrock",
    "aws",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "aws-lambda-powertools[tracer]>=3.34.0",
    "boto3>=1.43.72",
    "packaging>=26.3",
]

[project.urls]
Homepage = "https://github.com/brunovicco/opslens"
Repository = "https://github.com/brunovicco/opslens"
Documentation = "https://github.com/brunovicco/opslens/tree/main/docs"
Changelog = "https://github.com/brunovicco/opslens/blob/main/docs/adr/README.md"

# The reviewer path, as installed commands. Each target is the same module the
# repository script delegates to, so `uv run python scripts/demo_opslens.py` and
# `opslens-demo` cannot drift apart.
[project.scripts]
opslens-demo = "opslens.demo.cli:main"
opslens-demo-evaluate = "opslens.demo.evaluation_cli:main"
opslens-demo-web = "opslens.demo.web_cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pyright",
    "ruff",
    "boto3-stubs[boto3,s3]>=1.43.72",
    "mcp==2.2.0",
]

epss-silver-runtime = [
    "pyarrow==25.0.*",
]

epss-history-transformer-runtime = [
    "aws-lambda-powertools[tracer]>=3.34.0",
    "boto3>=1.43.72",
    "pyarrow==25.0.*",
]

ghsa-silver-runtime = [
    "pyarrow==25.0.*",
]

kev-silver-runtime = [
    "pyarrow==25.0.*",
]

nvd-silver-runtime = [
    "pyarrow==25.0.*",
]

[tool.uv]
required-version = ">=0.12.3"
default-groups = [
    "dev",
    "epss-silver-runtime",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-q",
    "--strict-markers",
    "--import-mode=importlib",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D",
    "DTZ",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "TID",
    "UP",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Annotations are evaluated at runtime in this codebase; quote forward references instead." }

[tool.pyright]
include = [
    "src",
    "tests",
]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

executionEnvironments = [
    { root = "src/opslens/transformation/epss/adapters/outbound", reportUnknownArgumentType = "none", reportUnknownMemberType = "none", reportUnknownParameterType = "none", reportUnknownVariableType = "none" },
    { root = "tests/unit/transformation/epss/adapters/outbound", reportUnknownArgumentType = "none", reportUnknownMemberType = "none", reportUnknownParameterType = "none", reportUnknownVariableType = "none" },
    { root = "src/opslens/transformation/kev/adapters/outbound", reportUnknownArgumentType = "none", reportUnknownMemberType = "none", reportUnknownParameterType = "none", reportUnknownVariableType = "none" },
    { root = "tests/unit/transformation/kev/adapters/outbound", reportUnknownArgumentType = "none", reportUnknownMemberType = "none", reportUnknownParameterType = "none", reportUnknownVariableType = "none" },
    { root = "." },
]
