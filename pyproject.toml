[project]
name = "opslens"
version = "0.1.0"
description = "Operational intelligence platform for software delivery and cloud operations."
requires-python = ">=3.13,<3.15"
dependencies = [
    "aws-lambda-powertools[tracer]>=3.34.0",
    "boto3>=1.43.72",
    "governed-llm-gateway-client",
    "governed-llm-gateway-contracts",
    "packaging>=26.3",
]

[tool.uv.sources]
governed-llm-gateway-client = { git = "https://github.com/brunovicco/governed-llm-gateway.git", rev = "ba5661514f90aff96749789e3275ce5685e1aea4", subdirectory = "packages/gateway-client" }
governed-llm-gateway-contracts = { git = "https://github.com/brunovicco/governed-llm-gateway.git", rev = "ba5661514f90aff96749789e3275ce5685e1aea4", subdirectory = "packages/gateway-contracts" }

[dependency-groups]
dev = [
    "pytest",
    "pyright",
    "ruff",
    "boto3-stubs[boto3,s3]>=1.43.72",
]

epss-silver-runtime = [
    "pyarrow==25.0.*",
]

ghsa-silver-runtime = [
    "pyarrow==25.0.*",
]

kev-silver-runtime = [
    "pyarrow==25.0.*",
]

nvd-silver-runtime = [
    "pyarrow==25.0.*",
]

[tool.uv]
default-groups = [
    "dev",
    "epss-silver-runtime",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-q",
    "--strict-markers",
    "--import-mode=importlib",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D",
    "DTZ",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = [
    "src",
    "tests",
]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

executionEnvironments = [
    { root = "src/opslens/transformation/epss/adapters/outbound", reportUnknownArgumentType = "none", reportUnknownMemberType = "none", reportUnknownParameterType = "none", reportUnknownVariableType = "none" },
    { root = "tests/unit/transformation/epss/adapters/outbound", reportUnknownArgumentType = "none", reportUnknownMemberType = "none", reportUnknownParameterType = "none", reportUnknownVariableType = "none" },
    { root = "src/opslens/transformation/kev/adapters/outbound", reportUnknownArgumentType = "none", reportUnknownMemberType = "none", reportUnknownParameterType = "none", reportUnknownVariableType = "none" },
    { root = "tests/unit/transformation/kev/adapters/outbound", reportUnknownArgumentType = "none", reportUnknownMemberType = "none", reportUnknownParameterType = "none", reportUnknownVariableType = "none" },
    { root = "." },
]
