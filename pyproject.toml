[project]
name = "opslens"
version = "0.1.0"
description = "Operational intelligence platform for software delivery and cloud operations."
requires-python = ">=3.13,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pyright",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-q",
    "--strict-markers",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D",
    "DTZ",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = [
    "src",
    "tests",
]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
